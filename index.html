<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Flappy Bird</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐤</text></svg>" />

    <!-- X / Twitter Player Card: shows poster.png with a play button, then loads this page in an iframe -->
    <meta name="twitter:card" content="player" />
    <meta name="twitter:title" content="Flappy Bird, right in your timeline" />
    <meta name="twitter:description" content="Click to play. No install, no app, just flap." />
    <meta name="twitter:image" content="%SITE_URL%/poster.png" />
    <meta name="twitter:image:alt" content="Flappy Bird title screen" />
    <meta name="twitter:player" content="%SITE_URL%/" />
    <meta name="twitter:player:width" content="600" />
    <meta name="twitter:player:height" content="600" />

    <!-- Open Graph fallback for other sites (Discord, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Flappy Bird, right in your timeline" />
    <meta property="og:description" content="Click to play. No install, no app, just flap." />
    <meta property="og:image" content="%SITE_URL%/poster.png" />

    <style>
      html, body { margin: 0; height: 100%; background: #4ec0ca; overflow: hidden; }
      body { display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
      #stage { position: relative; }
      canvas { display: block; outline: none; }
      #name-form {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(80%, 320px); box-sizing: border-box; padding: 16px;
        display: flex; flex-direction: column; gap: 10px;
        font: 600 15px system-ui, sans-serif; color: #fff; text-align: center;
        background: #543847; border: 3px solid #fff; border-radius: 12px;
      }
      #name-form[hidden] { display: none; }
      #name-form strong { font-size: 18px; }
      #name-input {
        font: inherit; color: #543847; text-align: center;
        padding: 8px; border: 2px solid #fff; border-radius: 8px; background: #fff;
      }
      #name-form .buttons { display: flex; gap: 8px; }
      #name-form button {
        flex: 1; font: inherit; padding: 8px; border-radius: 8px; cursor: pointer;
        border: 2px solid #fff; background: #73bf2e; color: #fff;
      }
      #name-form button[type="button"] { background: transparent; }
      #name-status { min-height: 1.2em; font-size: 13px; color: #fcd34d; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" tabindex="0"></canvas>
      <form id="name-form" hidden autocomplete="off">
        <strong>🏆 Top 10 score!</strong>
        <label for="name-input">Enter your name</label>
        <input id="name-input" name="name" required spellcheck="false" enterkeyhint="done" />
        <div class="buttons">
          <button type="button" id="name-skip">Skip</button>
          <button type="submit">Save</button>
        </div>
        <div id="name-status" aria-live="polite"></div>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
